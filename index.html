<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bolão Copa</title>

  <style>
    body{
      font-family: Arial;
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .jogo{
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    .placar{
      width: 40px;
      text-align: center;
    }

    .time{
      font-weight: bold;
    }

    .extras{
  margin-top:30px;
  display:grid;
  gap:10px;
}

.extras input{
  padding:8px;
  font-size:14px;
}
.participante{
  display:grid;
  gap:10px;
  margin-bottom:25px;
}

.participante input{
  padding:8px;
  font-size:14px;
}    
#enviarPalpite{
  margin-top:20px;
  width:100%;
  padding:18px;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
  border:none;
  border-radius:10px;
}    
  </style>
</head>

<body>

<h2>🏆 Bolão Copa</h2>
<div class="participante">

  <label>Nome/Apelido:</label>
  <input type="text" id="nome">

  <label>WhatsApp/E-mail:</label>
  <input type="text" id="contato">

</div>  

<div id="jogos">Carregando...</div>
<h2>🏆 Palpites Extras</h2>

<div class="extras">

  <label>Campeão:</label>
  <input type="text" id="campeao">

  <label>Vice-Campeão:</label>
  <input type="text" id="vice">

  <label>Terceiro Lugar:</label>
  <input type="text" id="terceiro">

  <label>Quarto Lugar:</label>
  <input type="text" id="quarto">

  <label>Artilheiro (Opção 1):</label>
  <input type="text" id="art1">

  <label>Artilheiro (Opção 2):</label>
  <input type="text" id="art2">

  <label>Artilheiro (Opção 3):</label>
  <input type="text" id="art3">

  <button id="enviarPalpite">
  Enviar Palpite
</button>

</div>  

<script>

const API_URL = "https://mute-glade-5bdb.brasfootonny.workers.dev/";

fetch(API_URL)
  .then(r => r.json())
  .then(jogos => {

    let html = "";

    jogos.forEach(j => {

html += `
  <div style="padding:10px;border-bottom:1px solid #ddd;">

    <div style="font-size:12px;color:#666;margin-bottom:6px;">
      ID: ${j.id}
      | Rodada: ${j.rodada}
      | Grupo: ${j.grupo}
      | Dia: ${j.dia}
      | Hora: ${j.hora}
    </div>

    <div style="font-size:18px;font-weight:bold;">

      ${j.casa}

      <img
        src="${j.flagCasa}"
        width="28"
        height="18"
        style="vertical-align:middle;margin-left:5px;"
      >

<input
  type="number"
  min="0"
  class="placar-casa"
  data-id="${j.id}"
>

x

<input
  type="number"
  min="0"
  class="placar-fora"
  data-id="${j.id}"
>

      <img
        src="${j.flagFora}"
        width="28"
        height="18"
        style="vertical-align:middle;margin-right:5px;"
      >

      ${j.fora}

    </div>

  </div>
`;
    });

    document.getElementById("jogos").innerHTML = html;
  });

  const URL_ENVIO =
  "https://script.google.com/macros/s/AKfycbwVDbVDvuSCQbH-P7X76zhcTr2CcmWyaJed69pIMIbl1Uf8r469IZyHsUIZYLlnJw7M/exec";

document
  .getElementById("enviarPalpite")
  .addEventListener("click", async () => {

    const dados = {
      nome: document.getElementById("nome").value,
      contato: document.getElementById("contato").value,

      campeao: document.getElementById("campeao").value,
      vice: document.getElementById("vice").value,
      terceiro: document.getElementById("terceiro").value,
      quarto: document.getElementById("quarto").value,

      art1: document.getElementById("art1").value,
      art2: document.getElementById("art2").value,
      art3: document.getElementById("art3").value
    };

    try {

      const jogos = [];

document
  .querySelectorAll(".placar-casa")
  .forEach(inputCasa => {

    const id = inputCasa.dataset.id;

    const inputFora =
      document.querySelector(
        `.placar-fora[data-id="${id}"]`
      );

    jogos.push({
      id: id,
      casa: inputCasa.value,
      fora: inputFora.value
    });

  });

dados.jogos = jogos;
      await fetch(URL_ENVIO, {
        method: "POST",
        body: JSON.stringify(dados)
      });

      alert("Palpite enviado com sucesso!");

    } catch(err) {

      alert("Erro ao enviar palpite");

    }
  });

</script>

</body>
</html>

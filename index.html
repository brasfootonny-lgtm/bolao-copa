<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bolão Copa</title>

  <style>
    body{
      font-family: Arial;
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .jogo{
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    .placar{
      width: 40px;
      text-align: center;
    }

    .time{
      font-weight: bold;
    }
  </style>
</head>

<body>

<h2>🏆 Bolão Copa</h2>

<div id="jogos">Carregando...</div>

<script>

const API_URL = "https://mute-glade-5bdb.brasfootonny.workers.dev/";

fetch(API_URL)
  .then(r => r.json())
  .then(jogos => {

    let html = "";

    jogos.forEach(j => {

html += `
  <div style="padding:10px;border-bottom:1px solid #ddd;">

    <div style="font-size:12px;color:#666;margin-bottom:6px;">
      ID: ${j.id}
      | Rodada: ${j.rodada}
      | Grupo: ${j.grupo}
      | Dia: ${j.dia}
      | Hora: ${j.hora}
    </div>

    <div style="font-size:18px;font-weight:bold;">

      ${j.casa}

      <img
        src="${j.flagCasa}"
        width="28"
        height="18"
        style="vertical-align:middle;margin-left:5px;"
      >

      <input
        type="number"
        min="0"
        class="placar"
      >

      x

      <input
        type="number"
        min="0"
        class="placar"
      >

      <img
        src="${j.flagFora}"
        width="28"
        height="18"
        style="vertical-align:middle;margin-right:5px;"
      >

      ${j.fora}

    </div>

  </div>
`;
    });

    document.getElementById("jogos").innerHTML = html;
  });

</script>

</body>
</html>

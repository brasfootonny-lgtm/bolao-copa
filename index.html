<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bolão Copa</title>

  <style>
    body{
      font-family: Arial;
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .jogo{
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    .placar{
      width: 40px;
      text-align: center;
    }

    .time{
      font-weight: bold;
    }
  </style>
</head>

<body>

<h2>🏆 Bolão Copa</h2>

<div id="jogos">Carregando...</div>

<script>

const API_URL = "https://mute-glade-5bdb.brasfootonny.workers.dev/";

fetch(API_URL)
  .then(r => r.json())
  .then(jogos => {

    let html = "";
    let rodadaAtual = "";

    jogos.forEach(j => {

      let id = j[0];
      let rodada = j[1];
      let grupo = j[2];
      let dia = j[3];

      if (rodada !== rodadaAtual) {
        rodadaAtual = rodada;
        html += `<div class="rodada">Rodada ${rodada} | Grupo ${grupo}</div>`;
      }

      html += `
        <div class="jogo">
          <div class="time">
            ID: ${id} | Dia: ${dia}
          </div>

          <div>
            <input class="placar" type="number"> x
            <input class="placar" type="number">
          </div>

          <div class="time"></div>
        </div>
      `;
    });

    document.getElementById("jogos").innerHTML = html;
  });

</script>

</body>
</html>
